name: Despliegue Automático Hotel

on:
  push:
    branches:
      - main
      - master
      - examen-cloud

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: 2. Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. Construir y subir la nueva imagen
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: parcibalnomas/hotel-backend:latest

      - name: 4. Conectar a AWS y actualizar Kubernetes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            sudo kubectl rollout restart deployment hotel-backend-deployment