name: Pipeline Completo CI/CD Hotel

on:
  push:
    branches:
      - main
      - master
      - examen-cloud

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 3. Instalar dependencias y probar Backend
        working-directory: ./backend
        run: |
          npm ci
          npm test

      - name: 4. Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 5. Construir y subir imagen del Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: parcibalnomas/hotel-backend:latest

      - name: 6. Construir y subir imagen del Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: parcibalnomas/hotel-frontend:latest

      - name: 7. Conectar a AWS y actualizar Kubernetes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            sudo kubectl apply -f backend/k8s/frontend.yaml
            sudo kubectl rollout restart deployment hotel-backend-deployment
            sudo kubectl rollout restart deployment hotel-frontend-deployment