apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-backend-deployment
  labels:
    app: hotel-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-backend
  template:
    metadata:
      labels:
        app: hotel-backend
    spec:
      containers:
      - name: hotel-backend
        image: parcibalnomas/hotel-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: hotel-secrets
              key: SUPABASE_URL
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-backend-service
spec:
  selector:
    app: hotel-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP